<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" fill="#0A0D14" rx="45"/>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8B94A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main icon: flowing wave with AI concept -->
  <!-- Left wave -->
  <path d="M 40 100 Q 60 70 80 100 T 120 100" stroke="url(#grad1)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right wave -->
  <path d="M 80 120 Q 100 90 120 120 T 160 120" stroke="url(#grad1)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Center dot (AI nucleus) -->
  <circle cx="100" cy="110" r="6" fill="#E8B94A"/>
  
  <!-- Small accent dots -->
  <circle cx="60" cy="100" r="3" fill="#6C5CE7" opacity="0.7"/>
  <circle cx="140" cy="100" r="3" fill="#E8B94A" opacity="0.7"/>
  <circle cx="80" cy="130" r="2" fill="#6C5CE7" opacity="0.5"/>
  <circle cx="120" cy="130" r="2" fill="#E8B94A" opacity="0.5"/>
</svg>