<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagamento confirmado! — TechFlow Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0d14;
        --card: #161b26;
        --text: #f2f0ea;
        --muted: #8b92a5;
        --accent: #6c5ce7;
        --accent-2: #e8b94a;
        --radius: 14px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrap {
        text-align: center;
        max-width: 520px;
        padding: 40px;
      }
      .icon {
        font-size: 4rem;
        margin-bottom: 20px;
      }
      h1 {
        font-family: "Sora";
        font-size: 2rem;
        margin-bottom: 14px;
      }
      p {
        color: var(--muted);
        margin-bottom: 28px;
        line-height: 1.6;
      }
      .btn {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        padding: 13px 28px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 700;
      }
      .btn:hover {
        opacity: 0.88;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="icon">✅</div>
      <h1>Pagamento confirmado!</h1>
      <p>
        Seu acesso ao TechFlow Academy foi liberado. Em alguns segundos você
        será redirecionado para a área de membros...
      </p>
      <a class="btn" href="membros.html">Ir agora mesmo →</a>
    </div>

    <script>
      // Redireciona automaticamente após 3 segundos
      setTimeout(() => {
        window.location.href = "membros.html";
      }, 3000);
    </script>
  </body>
</html>
