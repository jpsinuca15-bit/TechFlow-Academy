<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- Background -->
  <rect width="400" height="200" fill="#0A0D14" rx="20"/>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="gradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8B94A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo icon (left) -->
  <g transform="translate(50, 50)">
    <!-- Flowing AI waves -->
    <path d="M 20 50 Q 40 30 60 50 T 100 50" stroke="url(#gradMain)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 30 70 Q 50 50 70 70 T 110 70" stroke="url(#gradMain)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="60" cy="60" r="5" fill="#E8B94A"/>
  </g>
  
  <!-- Text (right) -->
  <text x="170" y="85" font-family="'Sora', sans-serif" font-size="42" font-weight="700" fill="#F2F0EA" letter-spacing="-0.02em">
    TechFlow
  </text>
  <text x="170" y="130" font-family="'Inter', sans-serif" font-size="18" fill="#E8B94A" font-weight="600" letter-spacing="0.05em">
    ACADEMY
  </text>
</svg>